<nav
  class="navbar navbar-expand-lg fixed-top"
  id="mainNav"
  [class.scrolled]="isScrolled || currentRoute === '/about'"
>
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <div class="logo-icon me-2">
        <i class="fas fa-mug-hot"></i>
      </div>
      <span class="logo-text">Bean <span>&</span> Brew</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i class="fas fa-home me-1"></i>Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/menu" routerLinkActive="active">
            <i class="fas fa-coffee me-1"></i>Menu
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active">
            <i class="fas fa-info-circle me-1"></i>About Us
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/gallery" routerLinkActive="active">
            <i class="fas fa-images me-1"></i>Gallery
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active">
            <i class="fas fa-map-marker-alt me-1"></i>Contact Us
          </a>
        </li>

        <li class="nav-item">
          <a
            *ngIf="!isLoggedIn"
            class="nav-link btn-reserve"
            routerLink="/login"
          >
            <i class="fas fa-sign-in-alt me-1"></i>Login
          </a>

          <a
            *ngIf="isLoggedIn"
            class="nav-link btn-reserve"
            routerLink="/feedback"
          >
            <i class="fas fa-comment-dots me-1"></i>Customer Feedback
          </a>
        </li>

        <li class="nav-item ms-2" *ngIf="isLoggedIn">
          <button
            type="button"
            class="nav-link logout-btn"
            (click)="logout()"
            aria-label="Logout"
          >
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
