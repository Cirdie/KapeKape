<section class="page-hero">
  <div class="container">
    <p class="section-tag"><i class="fas fa-mug-hot"></i> Warm Favorites</p>
    <h1>Non-Coffee Hot Drinks</h1>
    <p>Comforting hot beverages without coffee, perfect for cozy moments</p>

    <nav aria-label="breadcrumb" class="mt-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
        <li class="breadcrumb-item"><a routerLink="/menu">Menu</a></li>
        <li class="breadcrumb-item active">Non-Coffee Hot Drinks</li>
      </ol>
    </nav>
  </div>
</section>

<section class="section-padding category-page-section">
  <div class="container">
    <div class="category-top-actions">
      <a routerLink="/menu" class="back-menu-link">
        <i class="fas fa-arrow-left"></i> Back to Menu Categories
      </a>
    </div>

    <div class="row g-4">
      <div class="col-md-6 col-lg-4" *ngFor="let item of items">
        <div class="category-menu-card">
          <div class="category-menu-image-wrap">
            <img
              [src]="item.image"
              [alt]="item.name"
              class="category-menu-image"
              loading="lazy"
            />
            <span class="category-menu-badge" *ngIf="item.badge">
              {{ item.badge }}
            </span>
          </div>

          <div class="category-menu-body">
            <h3>{{ item.name }}</h3>
            <p>{{ item.description }}</p>

            <div class="category-menu-footer">
              <span class="price">{{ item.price }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<button
  class="back-to-top"
  [class.visible]="showBackToTop"
  (click)="scrollTop()">
  <i class="fas fa-chevron-up"></i>
</button>
