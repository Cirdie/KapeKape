<section class="page-hero">
  <div class="container">
    <p class="section-tag"><i class="fas fa-utensils"></i> Our Offerings</p>
    <h1>Our Menu</h1>
    <p>Choose a category to explore our café selections</p>

    <nav aria-label="breadcrumb" class="mt-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
        <li class="breadcrumb-item active">Menu</li>
      </ol>
    </nav>
  </div>
</section>

<section class="section-padding menu-categories-section">
  <div class="container">
    <div class="section-header text-center mb-5">
      <p class="section-tag"><i class="fas fa-mug-hot"></i> Browse Categories</p>
      <h2 class="section-title">Find Your Favorite Menu Category</h2>
      <p class="section-desc">
        Click a category below to open its own page.
      </p>
    </div>

    <div class="row g-4">
      <div class="col-md-6 col-lg-4" *ngFor="let category of categories">
        <a [routerLink]="category.route" class="menu-category-card text-decoration-none">
          <div class="menu-category-image-wrap">
            <img
              [src]="category.image"
              [alt]="category.title"
              class="menu-category-image"
              loading="lazy"
            />
            <div class="menu-category-overlay">
              <span class="menu-category-badge">View Menu</span>
            </div>
          </div>

          <div class="menu-category-body">
            <h3>{{ category.title }}</h3>
            <p>{{ category.description }}</p>
            <span class="menu-category-link">
              Open Category <i class="fas fa-arrow-right"></i>
            </span>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>

<button
  class="back-to-top"
  [class.visible]="showBackToTop"
  (click)="scrollTop()">
  <i class="fas fa-chevron-up"></i>
</button>
