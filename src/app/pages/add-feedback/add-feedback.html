<section class="page-hero">
  <div class="container text-center">
    <p class="section-tag">
      <i class="fas fa-pen-to-square"></i>
      Share Your Experience
    </p>
    <h1>Add Feedback</h1>
    <p>We would love to hear your thoughts about Chai & Brew</p>
  </div>
</section>

<section class="section-padding bg-light-cream">
  <div class="container">
    <div class="add-feedback-wrapper">

      <div class="add-feedback-topbar">
        <div>
          <p class="section-tag mb-2">
            <i class="fas fa-star"></i>
            Customer Review Form
          </p>
          <h2 class="section-title mb-0">Create Feedback</h2>
        </div>

        <a routerLink="/my-feedback" class="btn btn-outline-custom">
          <i class="fas fa-arrow-left me-2"></i>
          Back to My Feedback
        </a>
      </div>

      <div class="add-feedback-card">
        <form (ngSubmit)="submitFeedback()">

          <div class="feedback-form-grid one-column">
  <div class="form-group">
    <label class="form-label">Feedback Title</label>
    <input
      type="text"
      class="form-control custom-input"
      [(ngModel)]="formData.title"
      name="title"
      placeholder="Enter feedback title"
    />
  </div>
</div>

          <div class="form-group">
            <label class="form-label">Rating</label>

            <div class="star-rating">
              <button
                type="button"
                class="star-btn"
                *ngFor="let star of stars"
                (click)="setRating(star)"
                [class.active]="star <= formData.rating"
                [attr.aria-label]="'Rate ' + star + ' star'"
              >
                <i class="fas fa-star"></i>
              </button>
            </div>

            <p class="rating-text">
              {{ formData.rating }} out of 5 stars
            </p>
          </div>

          <div class="form-group">
            <label class="form-label">Your Message</label>
            <div class="textarea-wrap">
              <textarea
                class="form-control custom-textarea"
                rows="6"
                [(ngModel)]="formData.message"
                name="message"
                placeholder="Share your experience with the food, coffee, ambiance, or service..."
              ></textarea>
            </div>
          </div>

          <div class="add-feedback-actions">
            <button
              type="button"
              class="btn btn-light-custom"
              (click)="resetForm()"
            >
              <i class="fas fa-rotate-left me-2"></i>
              Clear Form
            </button>

            <button
              type="submit"
              class="btn btn-primary-custom"
            >
              <i class="fas fa-paper-plane me-2"></i>
              Submit Feedback
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</section>
